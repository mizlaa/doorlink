<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Doorlink Demo</title>
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--ink:#0F1B2D;--muted:#64748B;--line:#E2E8F0;--blue:#1F5FD6;--blue2:#1749B0;--blue-t:#E8F0FD;--orange:#C05A12;--orange-t:#FDF0E6;--green:#2E7D46;--green-t:#E6F4EA;--red:#B42318;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C1220;--card:#151D2E;--ink:#EAF0F8;--muted:#9AA8BC;--line:#26324A;--blue:#5B8CF0;--blue2:#7BA5F5;--blue-t:#1B2A4A;--orange:#F0A060;--orange-t:#3A2615;--green:#6CC08B;--green-t:#15301F;--red:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1220;--card:#151D2E;--ink:#EAF0F8;--muted:#9AA8BC;--line:#26324A;--blue:#5B8CF0;--blue2:#7BA5F5;--blue-t:#1B2A4A;--orange:#F0A060;--orange-t:#3A2615;--green:#6CC08B;--green-t:#15301F;--red:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.shell{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
@media (min-width:600px){body{padding-top:24px}.shell{border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:820px;box-shadow:0 20px 60px -20px rgba(15,27,45,.25);background:var(--bg)}}
.demo-strip{background:var(--orange-t);color:var(--orange);font-size:11px;font-weight:600;text-align:center;padding:5px 8px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;background:none;border:0;padding:0}
.logo i{width:24px;height:24px;border-radius:6px;background:var(--ink);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:10px;background:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 4px);opacity:.9}
.icons{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--blue-t)}
.pad{padding:16px}
h1{font-size:26px;line-height:1.12;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
h1 span{color:var(--blue)}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue2)}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.hero{background:var(--card);border-radius:0 0 22px 22px;padding:14px 16px 18px;border-bottom:1px solid var(--line)}
.door-stage{background:linear-gradient(#DCE6F3,#EEF3F9);border-radius:16px;position:relative;overflow:hidden;margin:12px 0 10px;aspect-ratio:4/3;display:grid;place-items:end center}
.house{position:absolute;inset:0}
.door{position:relative;width:62%;aspect-ratio:1.18/1;margin-bottom:10%;background:#2B2F36;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 3px #1B1E23}
.door .panels{position:absolute;inset:0;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.door.open .panels{transform:translateY(-102%)}
.door .sec{position:absolute;left:0;right:0;border-bottom:2px solid #1B1E23}
.door .win{position:absolute;left:12%;right:12%;height:10%;background:linear-gradient(#8fa6bd,#5f7690);border-radius:3px}
.doorlabel{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink);background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.btn.open-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;height:40px;border-radius:999px;background:var(--blue);color:#fff;border:0;padding:0 18px;font-weight:600;font-size:12px;letter-spacing:.04em;white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
.tile b{display:block;font-size:15px}.tile small{color:var(--muted)}
.tile .chev{margin-left:auto;color:var(--muted)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
@media (min-width:600px){.tabs{position:absolute;bottom:0;border-radius:0 0 28px 28px}}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
.tab .ti{width:22px;height:22px;border-radius:7px;border:2px solid currentColor;display:block}
.tab.on{color:var(--blue);font-weight:600}
.tab.on .ti{background:var(--blue)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.in{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;color:var(--ink);width:100%;min-width:0}
textarea.in{height:auto;min-height:90px;padding:10px 12px}
.in:focus,button:focus-visible,.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--blue)}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block;background:var(--blue-t);color:var(--blue)}
.pill.o{background:var(--orange-t);color:var(--orange)}
.pill.g{background:var(--green-t);color:var(--green)}
.pill.n{background:var(--line);color:var(--muted)}
.demo-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--orange);background:var(--orange-t);padding:2px 6px;border-radius:5px}
.notice{background:var(--blue-t);border-radius:12px;padding:12px;font-size:13px}
.notice.o{background:var(--orange-t);color:var(--orange)}
.list{display:flex;flex-direction:column;gap:10px}
.quote{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.logo-b{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.price{font-size:22px;font-weight:700;letter-spacing:-.01em;text-align:right;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.doc{background:#fff;color:#111;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:20px;position:relative;overflow:hidden;font-size:12.5px;line-height:1.5}
.doc .band{background:#111;color:#fff;padding:12px 14px;margin:-20px -20px 14px;font-weight:700;letter-spacing:.02em}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.doc .wm span{transform:rotate(-24deg);font-weight:800;font-size:26px;color:rgba(192,90,18,.16);letter-spacing:.08em;text-align:center}
.screen-title{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.back{border:0;background:transparent;font-size:14px;color:var(--blue);font-weight:600;padding:6px 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:40;padding:16px;overflow:auto}
.sheet.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="demo-strip">DEMO — sample data, no real orders or payments</div>
  <header class="top">
    <button class="logo" data-go="home"><i></i>Doorlink</button>
    <div class="icons">
      <button class="ib" aria-label="Search" data-go="find"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ib" aria-label="Menu" id="menuBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button class="tab" data-go="home"><span class="ti"></span>Home</button>
    <button class="tab" data-go="find"><span class="ti"></span>Find</button>
    <button class="tab" data-go="manuals"><span class="ti"></span>Manuals</button>
    <button class="tab" data-go="messages"><span class="ti"></span>Messages</button>
    <button class="tab" data-go="market"><span class="ti"></span>Market</button>
    <button class="tab" data-go="account"><span class="ti"></span>Account</button>
  </nav>
  <div class="sheet hidden" id="menu" role="dialog" aria-label="Menu">
    <div class="row" style="justify-content:space-between"><b style="font-size:18px">Menu</b><button class="btn sm" id="menuClose">Close</button></div>
    <div class="list" style="margin-top:14px">
      <button class="card" style="text-align:left;color:var(--ink)" data-go="hire">Hire a pro</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="work">Find work</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="market">Marketplace</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="manuals">Manuals</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="spring">Spring calculator</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="design">Design</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="identify">Identify my door</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="compliance">Compliance & Safety Pack</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="dir/supplier">Suppliers</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="dir/manufacturer">Manufacturers</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="dir/installer">Installers</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="dash">Dashboard</button>
      <button class="card" style="text-align:left;color:var(--ink)" data-go="account">Sign in</button>
    </div>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
</div>

<script>
/* ===== Fictional seed data. Every name, number and review is invented for the demo. ===== */
const BUSINESSES=[
 {id:'westline',name:'Westline Door Systems',suburb:'Liverpool',rating:4.8,reviews:86,color:'#1F5FD6',init:'WD',mult:1.00,lead:14,types:['sectional','roller','tilt'],warranty:'5 years on door, 2 years motor',area:'Sydney South West'},
 {id:'summit',name:'Summit Roller & Gate Co',suburb:'Prestons',rating:4.6,reviews:54,color:'#0E7C6B',init:'SR',mult:0.97,lead:10,types:['roller','sectional'],warranty:'3 years on door, 1 year motor',area:'Sydney West'},
 {id:'bluegum',name:'Bluegum Automation',suburb:'Casula',rating:4.7,reviews:38,color:'#6B4FBF',init:'BA',mult:1.05,lead:21,types:['sectional','tilt'],warranty:'5 years on motor and door',area:'Macarthur'},
 {id:'metrospan',name:'MetroSpan Doorworks',suburb:'Bankstown',rating:4.4,reviews:112,color:'#B4530A',init:'MD',mult:0.93,lead:7,types:['roller','sectional','tilt'],warranty:'2 years on door',area:'Inner West'},
 {id:'crestview',name:'Crestview Access Solutions',suburb:'Parramatta',rating:4.9,reviews:29,color:'#2E7D46',init:'CA',mult:1.08,lead:28,types:['sectional','tilt'],warranty:'7 years on door, 3 years motor',area:'Parramatta & Hills'},
 {id:'southwest',name:'Southwest Gate Studio',suburb:'Moorebank',rating:4.5,reviews:41,color:'#8A2BE2',init:'SG',mult:1.01,lead:12,types:['roller','sectional'],warranty:'3 years on door and motor',area:'Sydney South West'},
 {id:'harbour',name:'Harbourline Shutters',suburb:'Alexandria',rating:4.3,reviews:23,color:'#0F6E8C',init:'HS',mult:0.99,lead:18,types:['roller'],warranty:'2 years on shutters',area:'Inner Sydney'},
 {id:'precision',name:'Precision Entry Fabrication',suburb:'Wetherill Park',rating:4.6,reviews:67,color:'#5B5B5B',init:'PE',mult:1.03,lead:24,types:['sectional','roller','tilt'],warranty:'5 years on fabrication',area:'Western Sydney'}
];
const PRODUCTS=[['door','Garage door'],['gate','Gate'],['fence','Fence'],['shutter','Shutter']];
const TYPES={door:[['sectional','Sectional'],['roller','Roller'],['tilt','Tilt']],gate:[['sliding','Sliding'],['swing','Swing'],['pedestrian','Pedestrian']],fence:[['colorbond','Colorbond'],['timber','Timber'],['slat','Slat']],shutter:[['window','Window'],['shop','Shop']]};
const DEFAULT_TYPE={door:'sectional',gate:'sliding',fence:'colorbond',shutter:'window'};
BUSINESSES.forEach(b=>{b.kind='installer';b.prods=['door']});
BUSINESSES[1].prods=['door','gate'];BUSINESSES[2].prods=['gate'];BUSINESSES[5].prods=['gate','fence'];BUSINESSES[6].prods=['shutter'];
const SUPPLIERS=[
 {id:'sup-coreparts',name:'Coreparts Supply Co',suburb:'Smithfield',area:'Western Sydney',rating:4.8,reviews:47,color:'#1F5FD6',init:'CS',kind:'supplier',about:'Fictional parts supplier: springs, rollers, tracks and remotes. Sample data only.'},
 {id:'sup-tracktown',name:'TrackTown Hardware',suburb:'Auburn',area:'Inner West',rating:4.7,reviews:31,color:'#0E7C6B',init:'TT',kind:'supplier',about:'Fictional hardware supplier for installers. Sample data only.'},
 {id:'sup-gatefit',name:'GateFit Components',suburb:'Revesby',area:'South West',rating:4.9,reviews:22,color:'#6B4FBF',init:'GF',kind:'supplier',about:'Fictional gate hardware supplier. Sample data only.'}
];
const MANUFACTURERS=[
 {id:'man-northgate',name:'Northgate',suburb:'Dandenong',area:'Australia (fictional)',rating:4.8,reviews:64,color:'#17324D',init:'NG',kind:'manufacturer',about:'Fictional manufacturer of sectional doors and motors. All models are sample data.'},
 {id:'man-veltrix',name:'Veltrix',suburb:'Campbellfield',area:'Australia (fictional)',rating:4.7,reviews:58,color:'#B4530A',init:'VX',kind:'manufacturer',about:'Fictional manufacturer of roller doors and gate motors. Sample data only.'},
 {id:'man-harbrook',name:'Harbrook',suburb:'Wetherill Park',area:'Australia (fictional)',rating:4.6,reviews:40,color:'#2E7D46',init:'HB',kind:'manufacturer',about:'Fictional manufacturer of tilt doors and accessories. Sample data only.'}
];
const REVIEW_LINES=['Quote matched the install, crew were tidy and on time.','Good communication. The motor setup took a few minutes and works well.','Clear pricing, no surprises on the invoice.','Solid job. Would book again.','Install ran a day later than planned but they kept me updated.'];
const CATALOGUE=[
 {id:'m1',brand:'Northgate',model:'NG-SX 2400',type:'Sectional',cat:'Garage door',price:'$1,890–$2,640',cond:'New',mfr:'Northgate'},
 {id:'m2',brand:'Veltrix',model:'VX-RL 2200',type:'Roller',cat:'Garage door',price:'$1,240–$1,780',cond:'New',mfr:'Veltrix'},
 {id:'m3',brand:'Harbrook',model:'HB-TL 2100',type:'Tilt',cat:'Garage door',price:'$1,560–$2,100',cond:'New',mfr:'Harbrook'},
 {id:'m4',brand:'Northgate',model:'NG-M4 motor',type:'Motor',cat:'Opener',price:'$640–$880',cond:'New',mfr:'Northgate'},
 {id:'m5',brand:'Veltrix',model:'VX-SL 4000',type:'Sliding gate motor',cat:'Gate',price:'$980–$1,350',cond:'New',mfr:'Veltrix'},
 {id:'m6',brand:'Harbrook',model:'HB-Remote x4',type:'Remote kit',cat:'Accessory',price:'$79–$120',cond:'New',mfr:'Harbrook'},
 {id:'m7',brand:'Northgate',model:'NG-SX 2100 (used)',type:'Sectional',cat:'Garage door',price:'$690–$980',cond:'Used, good',mfr:'Northgate'},
 {id:'m8',brand:'Veltrix',model:'VX-KP keypad',type:'Keypad',cat:'Accessory',price:'$140–$190',cond:'New',mfr:'Veltrix'}
];
const MANUALS=[
 {id:'man1',title:'Sectional door: installation checklist (sample)',brand:'Northgate',model:'NG-SX',pages:6},
 {id:'man2',title:'Roller door: user guide (sample)',brand:'Veltrix',model:'VX-RL',pages:8},
 {id:'man3',title:'Tilt door: maintenance schedule (sample)',brand:'Harbrook',model:'HB-TL',pages:4},
 {id:'man4',title:'Motor: remote programming steps (sample)',brand:'Northgate',model:'NG-M4',pages:3},
 {id:'man5',title:'Sliding gate motor: wiring diagram (sample)',brand:'Veltrix',model:'VX-SL',pages:2},
 {id:'man6',title:'Keypad: reset instructions (sample)',brand:'Veltrix',model:'VX-KP',pages:2}
];
const PRODUCT_TIPS=[['Check the data plate','The plate is usually on the inside edge of the door or near the motor. It shows brand, model and serial.'],['Look at the remote','Remote controls often show the brand name and a model number on the back.'],['Photograph the whole unit','A clear photo of the full door or gate helps match the model. Upload is simulated in this demo.']];
const COMPLIANCE=[
 {id:'c1',group:'Business',title:'Business information & document register'},
 {id:'c2',group:'Business',title:'Contractor compliance requirements & declaration'},
 {id:'c3',group:'WHS & safety',title:'WHS responsibilities statement'},
 {id:'c4',group:'WHS & safety',title:'Safe work method statement (SWMS)'},
 {id:'c5',group:'WHS & safety',title:'Risk assessment & hazard register'},
 {id:'c6',group:'WHS & safety',title:'Emergency management plan'},
 {id:'c7',group:'Inspections',title:'Master maintenance checklist'},
 {id:'c8',group:'Inspections',title:'Work incident & near-miss report'},
 {id:'c9',group:'Inspections',title:'Health & safety management plan'},
 {id:'c10',group:'Customer',title:'Warranty certificate template'},
 {id:'c11',group:'Customer',title:'Induction statement & record'},
 {id:'c12',group:'Customer',title:'Alcohol & fatigue policy'},
 {id:'c13',group:'Customer',title:'Subcontractor safety agreement'},
 {id:'c14',group:'WHS & safety',title:'Electrical safety checklist'},
 {id:'c15',group:'Inspections',title:'Site safety walk-through checklist'}
];
const ROLES={
 customer:{email:'customer@demo.doorlink.test',name:'Alex Demo',tabs:['home','find','manuals','messages','market','account']},
 installer:{email:'installer@demo.doorlink.test',name:'Sam Installer',tabs:['home','work','manuals','messages','market','account']},
 supplier:{email:'supplier@demo.doorlink.test',name:'Jordan Supplier',tabs:['home','find','manuals','messages','market','account']},
 manufacturer:{email:'manufacturer@demo.doorlink.test',name:'Riley Maker',tabs:['home','find','manuals','messages','market','account']},
 admin:{email:'admin@demo.doorlink.test',name:'Dana Admin',tabs:['home','find','manuals','messages','market','account']}
};
const PASSWORD='Demo123!';

/* ===== Local state (per browser, reset from Account) ===== */
const KEY='doorlink-demo-v1';
const defaults={session:null,design:{product:'door',type:'sectional',width:2400,height:2100,color:'Charcoal',finish:'Satin',panels:'Raised',sections:4,windows:'Top row',hardware:'Brushed',insulation:'Backed',opener:'Belt drive'},jobs:[],requests:[],posts:[],rates:{door:{sectional:620,roller:520,tilt:580},gate:{sliding:900,swing:760,pedestrian:520},fence:{colorbond:260,timber:340,slat:420},shutter:{window:540,shop:700}},listings:[]};
let S=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v?{...defaults,...v}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===== Pricing: deterministic, documented, no randomness =====
   ex-GST = area(m²) × rate[type] × finish factor + opener + installation
   Business totals = ex-GST × business.mult, then GST (10%) added. */
const FINISH={Matte:1.00,Satin:1.04,Gloss:1.08,Woodgrain:1.14};
const COLOURS={Charcoal:1.00,'Slate grey':1.00,White:0.98,Monument:1.02};
const OPENERS={'None':0,'Belt drive':680,'Chain drive':520,'Smart motor':890};
const INSTALL=640;
function exGst(d){
  const m2=d.width*d.height/1e6;
  const rate=((S.rates||{})[d.product||'door']||{})[d.type]||400;
  const base=m2*rate*(FINISH[d.finish]||1)*(COLOURS[d.color]||1);
  const sectionAdj=d.type==='sectional'?(d.sections-3)*35:0;
  return Math.round(base+sectionAdj+(OPENERS[d.opener]||0)+INSTALL);
}
function quoteFor(b,d){const ex=Math.round(exGst(d)*b.mult);const gst=Math.round(ex*0.1);return{ex,gst,total:ex+gst}}
const money=c=>'$'+c.toLocaleString('en-AU');

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2400)}
function go(v){location.hash=v}
function setTabs(){const role=S.session?S.session.role:'customer';document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',location.hash.slice(1).split('/')[0]===t.dataset.go);t.classList.toggle('hidden',S.session&&!ROLES[role].tabs.includes(t.dataset.go))})}

/* ===== Door preview (SVG-free CSS door with section lines) ===== */
function doorHTML(d,open){
  const n=Math.max(2,Math.min(6,+d.sections||4));
  let secs='';for(let i=1;i<n;i++){secs+=`<div class="sec" style="top:${(100/n)*i}%"></div>`}
  const win=(d.windows==='None')?'':`<div class="win" style="top:${(100/n)*0.25}%"></div>`;
  const col={Charcoal:'#2B2F36','Slate grey':'#5B6672',White:'#E9ECEF',Monument:'#3A3F47'}[d.color]||'#2B2F36';
  return `<div class="door ${open?'open':''}" style="width:${Math.min(70,30+d.width/120)}%;aspect-ratio:${d.width/d.height}"><div class="panels" style="background:${col}">${secs}${win}</div><span class="doorlabel">${((TYPES[d.product||'door']||[]).find(t=>t[0]===d.type)||[0,'Door'])[1].toUpperCase()} · ${d.width}×${d.height}</span></div>`;
}

function route(){
  const h=(location.hash||'#home').slice(1);
  const [name,...args]=h.split('/');
  const shell=$('#shell');
  $('#menu').classList.add('hidden');
  const gate=!S.session&&!['signin','account'].includes(name);
  if(gate){location.hash='account';return}
  const map={home:V.home,hire:V.hire,jobs:V.jobs,work:V.work,design:V.design,find:V.find,market:V.market,manuals:V.manuals,spring:V.spring,identify:V.identify,compliance:V.compliance,messages:V.messages,account:V.account,signin:V.signin,dash:V.dash,dir:V.dir,biz:V.biz};
  (map[name]||V.home)(args);
  setTabs();
  window.scrollTo(0,0);
}

  const t=e.target.closest('[data-go]');
  if(t&&!t.matches('.tab, nav *')){ e.preventDefault(); go(t.dataset.go); return }
  const tab=e.target.closest('.tab');
  if(tab){go(tab.dataset.go)}
});
$('#menuBtn').onclick=()=>$('#menu').classList.remove('hidden');
$('#menuClose').onclick=()=>$('#menu').classList.add('hidden');
window.addEventListener('hashchange',route);
route();
</script>
</body>
