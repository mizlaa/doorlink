name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Import integrity guard
        run: bash .github/scripts/check-import-integrity.sh

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
